<!-- base.html -->
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <div id="divNavBarLogo">
                    <img src="{{ url_for('static', filename='img/logoUniv.png') }}" height="40" alt="University logo">
                    <a class="text-white text-decoration-none">Protein viewer</a>
                </div>
                <a class="text-white text-decoration-none"> EN </a>
            </div>
        </nav>
    </header>

    <div class="d-flex flex-grow-1">
        <div id="sidebar" class="bg-white text-black">

            <button id="toggleBtn" class="btn bg-white w-100 mb-3">
                ☰
            </button>

            <ul class="nav flex-column">

                <li class="nav-item p-2">
                    1 <span class="menu-text">page 1</span>
                </li>

                <li class="nav-item p-2">
                    2 <span class="menu-text">Page 2</span>
                </li>

                <li class="nav-item p-2">
                    3 <span class="menu-text">Page 3</span>
                </li>

                <li class="nav-item p-2">
                    4 <span class="menu-text">Page 4</span>
                </li>

            </ul>

        </div>

        <main id="content" class="flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>

    <footer class="bg-primary mt-auto py-3 border-top text-white">
        <div class="container d-flex justify-content-between align-items-center">
            <a>Internship Project - Helsinki University</a>
            <a>Hadet Matis</a>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}
    {% endblock %}

    <script>

        const logo = document.getElementById("divNavBarLogo");

        logo.addEventListener("click", () => {
            window.location.href = "{{ url_for('viewer.index') }}";
        });

        const sidebar = document.getElementById("sidebar");
        const toggleBtn = document.getElementById("toggleBtn");

        // Restaurer
        if (localStorage.getItem("sidebarCollapsed") === "true") {
            sidebar.classList.add("collapsed");
        }

        // Sauvegarder
        toggleBtn.addEventListener("click", () => {

            sidebar.classList.toggle("collapsed");

            localStorage.setItem(
                "sidebarCollapsed",
                sidebar.classList.contains("collapsed")
            );
        });
    </script>
</body>

</html>
