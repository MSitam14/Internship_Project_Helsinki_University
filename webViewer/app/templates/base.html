<!-- base.html -->
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/styles.css') }}">
    {% block style %}
    {% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <a href="{{ url_for('viewer.home') }}" id="divNavBarLogo"
                    class="text-white text-decoration-none d-flex align-items-center">

                    <img src="{{ url_for('static', filename='img/logoUniv.png') }}" height="40" alt="University logo">

                    <span class="ms-2">
                        Molecular Structure Analysis Platform
                    </span>

                </a>
            </div>
        </nav>
    </header>

    <div class="d-flex flex-grow-1">
        <div id="sidebar" class="bg-white text-black">

            <button id="toggleBtn" class="btn bg-white w-100 mb-3">
                <i class="bi bi-list"></i>
            </button>

            <ul class="nav flex-column">

                <li class="nav-item">
                    <a href="{{ url_for('viewer.home') }}" class="nav-link text-black">
                        <i class="bi bi-house-fill"></i>
                        <span class="menu-text">Home</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="{{ url_for('viewer.fitnessForm') }}" class="nav-link text-black">
                        <i class="bi bi-rulers"></i>
                        <span class="menu-text">Score a file</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="{{ url_for('viewer.requestFormHotSpots') }}" class="nav-link text-black">
                        <i class="bi bi-radar"></i>
                        <span class="menu-text">Hot spots</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="{{ url_for('viewer.requestFormComparison') }}" class="nav-link text-black">
                        <i class="bi bi-front"></i>
                        <span class="menu-text">Compare</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="{{ url_for('viewer.credits') }}" class="nav-link text-black">
                        <i class="bi bi-info-circle"></i>
                        <span class="menu-text">Credits</span>
                    </a>
                </li>

            </ul>

        </div>

        <main id="content" class="flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>

    <footer class="bg-primary mt-auto py-3 border-top text-white">
        <div class="container d-flex justify-content-between align-items-center">
            <a>University of Helsinki</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='js/base.js') }}"></script>


    {% block scripts %}
    {% endblock %}

</body>

</html>
