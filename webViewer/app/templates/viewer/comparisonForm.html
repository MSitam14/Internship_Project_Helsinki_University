{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title mb-3">Comparison</h2>

                <form action="/infoComparisonRequest" method="post" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label for="the_file1" class="form-label">Choose a file (only .pdb files are allowed):</label>
                        <input class="form-control" type="file" id="the_file1" name="the_file1" accept=".pdb" required>
                    </div>

                    <div class="mb-3">
                        <label for="the_file2" class="form-label">Choose a second file (only .pdb files are allowed):</label>
                        <input class="form-control" type="file" id="the_file2" name="the_file2" accept=".pdb" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Run</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}

{% endblock %}
