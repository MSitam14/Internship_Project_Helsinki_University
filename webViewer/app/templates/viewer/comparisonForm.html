{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title mb-3">Comparison</h2>

                <form action="/infoComparisonRequest" method="post" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label for="files" class="form-label">Choose files (2 minimum, only .pdb files are allowed):</label>
                        <input class="form-control" type="file" id="filesInput" name="files" accept=".pdb" required multiple>
                        <div id="filesList" class="mt-2 d-flex"></div>
                    </div>

                    <div class="form-group mb-3">
                        <label for="pocket_res_name" class="form-check-label">Pocket residue name</label>
                        <input class="form-number-input" type="text" id="pocket_res_name" name="pocket_res_name" value="">
                    </div>

                    <button type="submit" class="btn btn-primary">Run</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}

<script src="{{ url_for('static', filename='js/viewer/comparisonForm.js') }}"></script>

{% endblock %}
