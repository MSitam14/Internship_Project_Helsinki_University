{% extends 'base.html' %}

{% block content %}

<a> info page</a>

<!-- Loading overlay -->
<div id="loading" style="display:none;position:fixed;inset:0;background:rgba(255,255,255,0.8);align-items:center;justify-content:center;z-index:9999;">
    <div style="display:flex;flex-direction:column;align-items:center;">
        <div style="width:48px;height:48px;border:6px solid #ddd;border-top-color:#007bff;border-radius:50%;animation:spin 1s linear infinite"></div>
        <div style="margin-top:8px;font-size:14px;color:#333">Chargement…</div>
    </div>
</div>

<div class="d-flex">
    <a> Protein score : </a>
    <a id="proteinScore"></a>
</div>

<div class="d-flex">
    <a> Water score : </a>
    <a id="waterScore"></a>
</div>

<div class="d-flex">
    <a > Total score : </a>
    <a id="totalScore"></a>
</div>




{% endblock %}

{% block scripts %}

<script>

let dataResult = null;

const dataObj = JSON.parse({{ params | tojson }});

function showData(data) {
    dataResult = data;
    console.log(data);

    find(line => line.startsWith("SCORE:"));

    scoreList = [];

    scoreLine = data.content.pdb_file.file_content.split("\n").slice(0,3)
    for(let line of scoreLine) {
        dataInLine = line.replace(/\s+/g, " ");
        scoreList.push(dataInLine.split(" ")[4]);
    }

    document.getElementById("proteinScore").textContent = scoreList[0];
    document.getElementById("waterScore").textContent = scoreList[1];
    document.getElementById("totalScore").textContent = scoreList[2];    
}

// spinner animation
const styleEl = document.createElement('style');
styleEl.textContent = '@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }';
document.head.appendChild(styleEl);

// show loading
const showLoading = () => document.getElementById('loading').style.display = 'flex';
const hideLoading = () => document.getElementById('loading').style.display = 'none';

showLoading();


// on load, send POST request to backend
fetch("http://127.0.0.1:5000//api-score/score", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify(dataObj)
}).then(response => response.json())
.then(data => {
    showData(data);
    hideLoading();
})
.catch(error => {
    console.error("Error:", error);
    hideLoading();
});

</script>

{% endblock %}
