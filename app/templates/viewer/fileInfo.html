{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-xl-10">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <span>File Informations</span>
                <span class="badge text-bg-light text-primary">PDB</span>
            </div>
            <div class="card-body">
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item"><strong>Filename:</strong> {{ filename }}</li>
                    <li class="list-group-item"><strong>Content preview:</strong>
                        <pre class="mb-0 mt-2">{{ file_content[:500] }}</pre>
                    </li>
                    <li class="list-group-item"><strong>Visualisation tool:</strong> {{ techUsed }}</li>
                </ul>

                <div id="buttonDiv3DMol" class="mb-4" style="display: none;">
                    <input class="btn btn-primary" type="button" id="style_cartoon" value="Cartoon">
                    <input class="btn btn-primary" type="button" id="style_cross" value="cross">
                    <input class="btn btn-primary" type="button" id="style_line" value="Line">
                    <input class="btn btn-primary" type="button" id="style_sphere" value="sphere">
                    <input class="btn btn-primary" type="button" id="style_stick" value="stick">
                </div>

                <div class="border border-2 border-secondary rounded-3 p-2 bg-white shadow-sm mol-frame">
                    <div id="container-frame" class="mol-container"></div>
                </div>

                <button id="3DMolButton" class="btn btn-secondary mt-3">View with 3DMol</button>
                <button id="molStarButton" class="btn btn-secondary mt-3">View with Mol*</button>
                <button id="jsMolButton" class="btn btn-secondary mt-3">View with JSmol</button>
            </div>
        </div>
    </div>
</div>


{% endblock %}

{% block scripts %}

<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<script src="https://chemapps.stolaf.edu/jmol/jsmol/JSmol.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/molstar@latest/build/viewer/molstar.js"></script>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/molstar@latest/build/viewer/molstar.css" />

<script>
    function load3DMol() {
        const element = document.getElementById("container-frame");
        const config = { backgroundColor: "white" };
        const viewer = $3Dmol.createViewer(element, config);
        viewer.addModel(`{{ file_content }}`, "pdb");
        viewer.setStyle({}, { cartoon: { color: "spectrum" } });
        viewer.zoomTo();
        viewer.render();
        viewer.zoom(1.2, 1000);

        document.querySelectorAll('input[id^="style_"]').forEach(button => {
            button.addEventListener('click', () => {
                const style = button.id.replace('style_', '');
                viewer.setStyle({}, { [style]: { color: "spectrum" } });
                viewer.render();
            });
        });
    }

    function loadJSMol() {
        const container = document.getElementById('container-frame');
        if (!container) {
            console.error('Container element not found');
        }
        const pdbUrl = `/pdb_content/{{ pdb_id }}`;

        const width = container.width || 600;
        const height = container.height || 400;

        const Info = {
            width: width,
            height: height,
            j2sPath: 'https://chemapps.stolaf.edu/jmol/jsmol/j2s',
            use: 'HTML5',
            debug: false
        };

        const applet = Jmol.getApplet('applet0', Info);
        container.innerHTML = Jmol.getAppletHtml(applet);

        // load the structure once the applet is inserted
        try {
            Jmol.script(applet, 'load ' + pdbUrl);
        } catch (e) {
            console.error('JSmol load error:', e);
        }

        theApplet0 = document.getElementById('applet0_appletinfotablediv')

        container.appendChild(theApplet0);
        theApplet0.style.width = "100%";
        theApplet0.style.height = "100%";
    }

    function loadMolStar() {
        molstar.Viewer.create('container-frame', {
            layoutIsExpanded: false,
            layoutShowControls: false
        })
            .then(viewer => {
                const pdbUrl = `/pdb_content/{{ pdb_id }}`;

                return viewer.loadStructureFromUrl(pdbUrl, 'pdb');
            })
            .catch(error => {
                console.error('Erreur lors du chargement:', error);
                document.getElementById('container-frame').innerHTML =
                    '<p class="text-danger">Erreur : ' + error.message + '</p>';
            });
    }


    switch ("{{ techUsed }}") {
        case '3DMol':
            document.getElementById('buttonDiv3DMol').style.display = 'block';
            document.getElementById('3DMolButton').style.display = 'none';
            load3DMol();
            break;
        case 'Mol*':
            document.getElementById('buttonDiv3DMol').style.display = 'none';
            document.getElementById('molStarButton').style.display = 'none';
            loadMolStar();
            break;
        case 'JSmol':
            document.getElementById('buttonDiv3DMol').style.display = 'none';
            document.getElementById('jsMolButton').style.display = 'none';
            loadJSMol();
            break;

    }

    document.getElementById('molStarButton').addEventListener('click', () => {
        window.location.href = `/fileInfo/{{ pdb_id }}/Mol*`;
    });
    document.getElementById('jsMolButton').addEventListener('click', () => {
        window.location.href = `/fileInfo/{{ pdb_id }}/JSmol`;
    });
    document.getElementById('3DMolButton').addEventListener('click', () => {
        window.location.href = `/fileInfo/{{ pdb_id }}/3DMol`;
    });

</script>

{% endblock %}
