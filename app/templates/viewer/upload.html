{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title mb-3">Upload a file</h2>

                <form action="/uploadFileInDB" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="the_file" class="form-label">Choose a file to upload (only .pdb files are allowed):</label>
                        <input class="form-control" type="file" id="the_file" name="the_file" accept=".pdb" required>
                    </div>

                    <div class="mb-3">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="tech3Dmol" name="tech" value="3DMol" checked>
                            <label class="form-check-label" for="tech3Dmol">3DMol.js</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="techMolStar" name="tech" value="Mol*">
                            <label class="form-check-label" for="techMolStar">Mol* Viewer</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="techJSmol" name="tech" value="JSmol">
                            <label class="form-check-label" for="techJSmol">JSmol</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Upload</button>
                </form>
            </div>
        </div>
    </div>
</div>




{% endblock %}
