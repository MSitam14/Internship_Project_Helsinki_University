{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-xl-10">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h2>{{ a_variable }}</h2>
                <a class="btn btn-primary text-bg-light text-primary" href="{{ url_for('viewer.uploadPage') }}">Upload file</a>
            </div>
            <div class="card-body">

                <ul class="list-group list-group-flush mb-4">
                    {% for item in navigation %}
                    <li class="list-group-item d-flex justify-content-between">
                        <a class="text-decoration-none" href="/fileInfo/{{ item.id }}/3DMol">{{ item.name }}</a>
                        <button id="{{item.id}}" class="deleteButton btn btn-sm btn-outline-secondary ms-2">Delete</button>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>

{# a comment #}

{% endblock %}

{% block scripts %}
<script>
    document.querySelectorAll('button.deleteButton').forEach(button => {
        button.addEventListener('click', () => {
            const id = button.id.replace('.pdb', '');
            if (confirm('Are you sure you want to delete this file?')) {
                fetch(`/api/files/${id}`, { method: 'DELETE' })
                    .then(response => {
                        if (response.status == 200) {
                            location.reload();
                        } else {
                            alert('Failed to delete the file.');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('An error occurred while deleting the file.');
                    });
            }
        });
    });
</script>
{% endblock %}
