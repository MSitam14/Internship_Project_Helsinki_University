{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-xl-10">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <span>File Informations</span>
                <span class="badge text-bg-light text-primary">PDB</span>
            </div>
            <div class="card-body">
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item"><strong>Filename:</strong> {{ filename }}</li>
                    <li class="list-group-item"><strong>Content preview:</strong>
                        <pre class="mb-0 mt-2">{{ file_content[:500] }}</pre>
                    </li>
                    <li class="list-group-item"><strong>Visualisation tool:</strong> {{ techUsed }}</li>
                </ul>

                <div class="border border-2 border-secondary rounded-3 p-2 bg-white shadow-sm mol-frame">
                    <div id="container-frame" class="mol-container"></div>

                </div>

                <button id="3DMolButton" class="btn btn-secondary mt-3">View with 3DMol</button>
                <button id="molStarButton" class="btn btn-secondary mt-3">View with Mol*</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}

<script src="https://chemapps.stolaf.edu/jmol/jsmol/JSmol.min.js"></script>

<script>
</script>

</script>

<script>
    const container = document.getElementById('container-frame');
    if (!container) {
        console.error('Container element not found');
    }
    const pdbUrl = `/pdb_content/{{ pdb_id }}`;

    const width = container.width || 600;
    const height = container.height || 400;

    const Info = {
        width: width,
        height: height,
        j2sPath: 'https://chemapps.stolaf.edu/jmol/jsmol/j2s',
        use: 'HTML5',
        debug: false
    };

    const applet = Jmol.getApplet('applet0', Info);
    container.innerHTML = Jmol.getAppletHtml(applet);

    // load the structure once the applet is inserted
    try {
        Jmol.script(applet, 'load ' + pdbUrl);
    } catch (e) {
        console.error('JSmol load error:', e);
    }

    theApplet0 = document.getElementById('applet0_appletinfotablediv')

    container.appendChild(theApplet0);
    theApplet0.style.width = "100%";
    theApplet0.style.height = "100%";

</script>

<script>
    document.getElementById('3DMolButton').addEventListener('click', () => {
        window.location.href = `/fileInfo/{{ pdb_id }}/3DMol`;
    });
    document.getElementById('molStarButton').addEventListener('click', () => {
        window.location.href = `/fileInfo/{{ pdb_id }}/MolStar`;
    });
</script>



<style>
    .mol-container {
        width: 100%;
        height: 400px;
        position: relative;
        display: block;
    }

    .mol-frame {
        overflow: hidden;
    }
</style>
{% endblock %}
