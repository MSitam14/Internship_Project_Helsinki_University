{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-xl-10">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <span>File Informations</span>
                <span class="badge text-bg-light text-primary">PDB</span>
            </div>
            <div class="card-body">
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item"><strong>Filename:</strong> {{ filename }}</li>
                    <li class="list-group-item"><strong>Content preview:</strong>
                        <pre class="mb-0 mt-2">{{ file_content[:500] }}</pre>
                    </li>
                    <li class="list-group-item"><strong>Visualisation tool:</strong> {{ techUsed }}</li>
                </ul>

                <div class="border border-2 border-secondary rounded-3 p-2 bg-white shadow-sm mol-frame">
                    <div id="container-frame" class="mol-container"></div>

                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}

<script src="https://cdn.jsdelivr.net/npm/molstar@latest/build/viewer/molstar.js"></script>

<script>
    // Charger Mol* depuis l'endpoint Flask proprement
    molstar.Viewer.create('container-frame', {
        layoutIsExpanded: false,
        layoutShowControls: false
    })
        .then(viewer => {
            // Charger le fichier PDB depuis l'endpoint Flask
            const pdbUrl = `/pdb_content/{{ pdb_id }}`;

            return viewer.loadStructureFromUrl(pdbUrl, 'pdb');
        })
        .catch(error => {
            console.error('❌ Erreur lors du chargement:', error);
            document.getElementById('container-frame').innerHTML =
                '<p class="text-danger">Erreur : ' + error.message + '</p>';
        });

</script>

<style>
    .mol-container {
        width: 100%;
        height: 400px;
        position: relative;
        display: block;
    }

    .mol-frame {
        overflow: hidden;
    }
</style>
{% endblock %}
